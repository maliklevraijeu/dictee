name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pip install --disable-pip-version-check .
      - name: tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # tous les fichiers test_*.py : un nouveau test n'est jamais oublié
          foreach ($t in Get-ChildItem tests/test_*.py) {
            Write-Output "== $($t.Name)"
            python $t.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          python -c "import dictee.app, dictee.ecran, dictee.fenetre_memoire, dictee.fenetre_telephone, dictee.accueil, dictee.coffre"
